name: Build Q07 Launcher APK

permissions:
  contents: write

on:
  push:
    # licenses.json / version.json telefondan redaktə olunanda yeni yığım başlamasın
    paths-ignore:
      - 'licenses.json'
      - 'version.json'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.Q07_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # gradlew və ya gradle-wrapper.jar repoda yoxdursa, avtomatik yaradılır
      - name: Wrapper (lazım olarsa)
        if: hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' || hashFiles('gradlew') == ''
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      # Sabit imza açarı (varsa) — GitHub Secrets-dən
      - name: Signing key
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/q07.jks"
          echo "Q07_KEYSTORE=$RUNNER_TEMP/q07.jks" >> "$GITHUB_ENV"

      - name: Build release APK (R8 optimized)
        env:
          Q07_KS_PASS: ${{ secrets.Q07_KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Q07Launcher
          path: |
            app/build/outputs/apk/release/*.apk
            scanner/build/outputs/apk/release/*.apk

      # Hər uğurlu build GitHub Release kimi də dərc olunur (birbaşa yükləmə linki)
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Q07 Launcher build ${{ github.run_number }}
          body: "Commit ${{ github.sha }}"
          files: |
            app/build/outputs/apk/release/app-release.apk
            scanner/build/outputs/apk/release/scanner-release.apk
          make_latest: true
