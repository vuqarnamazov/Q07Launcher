name: Build Q07 Launcher APK

permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # gradlew və ya gradle-wrapper.jar repoda yoxdursa, avtomatik yaradılır
      - name: Wrapper (lazım olarsa)
        if: hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' || hashFiles('gradlew') == ''
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Q07Launcher-debug
          path: app/build/outputs/apk/debug/*.apk

      # Hər uğurlu build GitHub Release kimi də dərc olunur (birbaşa yükləmə linki)
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Q07 Launcher build ${{ github.run_number }}
          body: "Commit ${{ github.sha }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
